[project]
name = "maintenance-agent"
version = "0.1.0"
description = "Code maintenance agent: report + PR, human merges"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "tree-sitter>=0.23", "tree-sitter-java>=0.23"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
maintenance-agent = "agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*"]
